<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <!-- Realistic soft drop shadow matching the official logo -->
    <filter id="nexus-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <!-- Subtle glow on hover/accent -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F5FF" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#nexus-shadow)">
    <!-- 1. Left Letter 'N' in Vibrant Electric Purple -->
